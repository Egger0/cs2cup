<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>后台管理 · CS2 校园杯</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0A0E16;--bg-2:#0D131F;--surface:#121A28;--surface-2:#17212F;
    --line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.16);
    --ink:#EAF0F7;--muted:#8593A6;--muted-2:#5E6B7D;
    --ct:#3D9BE9;--t:#E3A63A;--c4:#E5484D;--ok:#3fe07f;
    --fd:"Chakra Petch","Noto Sans SC",system-ui,sans-serif;
    --fb:"Noto Sans SC","Chakra Petch",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--fb);line-height:1.6;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(900px 500px at 15% -10%,rgba(61,155,233,.10),transparent 60%),radial-gradient(800px 500px at 90% 0,rgba(227,166,58,.08),transparent 62%)}
  .wrap{max-width:1100px;margin:0 auto;padding:0 clamp(16px,4vw,36px);position:relative;z-index:1}
  a{color:var(--ct)}
  h1,h2,h3,h4{font-family:var(--fd);font-weight:700;line-height:1.15}
  .fd{font-family:var(--fd)}
  .muted{color:var(--muted)}
  code{font-family:ui-monospace,Menlo,Consolas,monospace;background:rgba(255,255,255,.06);padding:1px 6px;border-radius:3px;font-size:.86em}

  .bar{border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(10,14,22,.95),rgba(10,14,22,.8));backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
  .bar-in{display:flex;align-items:center;justify-content:space-between;height:60px}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700}
  .brand .mark{width:28px;height:28px;display:grid;place-items:center;border:1.5px solid var(--ct);color:var(--ct);font-size:.75rem;clip-path:polygon(14% 0,100% 0,100% 86%,86% 100%,0 100%,0 14%)}
  .brand .mark.has-img{border:none}
  .brand .mark img{width:100%;height:100%;object-fit:cover;display:block}
  .brand small{display:block;font-weight:500;font-size:.62rem;letter-spacing:.22em;color:var(--muted-2);text-transform:uppercase}
  .btn{font-family:var(--fd);font-weight:600;font-size:.92rem;padding:10px 18px;border-radius:3px;border:1px solid transparent;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px}
  .btn-primary{background:var(--ct);color:#06121f}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-ghost{background:transparent;border-color:var(--line-strong);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--t);color:var(--t)}
  .btn-danger{background:transparent;border-color:rgba(229,72,77,.5);color:var(--c4);padding:6px 10px;font-size:.82rem}
  .btn-danger:hover{background:rgba(229,72,77,.12)}
  .btn-mini{padding:5px 10px;font-size:.78rem}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .banner{margin:16px 0;padding:12px 16px;border-radius:4px;border:1px solid var(--line-strong);font-size:.9rem;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .banner.warn{border-color:rgba(227,166,58,.4);background:rgba(227,166,58,.08);color:#f0d9a8}
  .banner.err{border-color:rgba(229,72,77,.4);background:rgba(229,72,77,.08);color:#f3b0b2}
  .banner.info{border-color:rgba(61,155,233,.4);background:rgba(61,155,233,.08);color:#bcdcf7}
  .banner.ok{border-color:rgba(64,192,120,.4);background:rgba(64,192,120,.08);color:#a9e6c2}

  .login{max-width:440px;margin:8vh auto;background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--line);border-top:2px solid var(--ct);border-radius:6px;padding:32px}
  .login h1{font-size:1.5rem;margin-bottom:4px}
  .login p{color:var(--muted);font-size:.9rem;margin-bottom:22px}
  .login .split{border-top:1px solid var(--line);margin:22px 0 16px}

  .field{margin-bottom:16px}
  label{display:block;font-family:var(--fd);font-size:.8rem;letter-spacing:.06em;color:#cdd6e2;margin-bottom:7px}
  label .hint{font-family:var(--fb);color:var(--muted-2);font-size:.74rem;margin-left:6px}
  input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line-strong);color:var(--ink);font-family:var(--fb);font-size:.95rem;padding:11px 13px;border-radius:3px;transition:.15s}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ct);box-shadow:0 0 0 3px rgba(61,155,233,.14)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
  .logo-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logo-preview{width:56px;height:56px;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--bg);border:1.5px solid var(--ct);color:var(--ct);font-family:var(--fd);font-weight:700;font-size:1.1rem;clip-path:polygon(14% 0,100% 0,100% 86%,86% 100%,0 100%,0 14%)}
  .logo-preview.has-img{border:none}
  .logo-preview img{width:100%;height:100%;object-fit:cover;display:block}
  .logo-ctrl{display:flex;flex-direction:column;gap:8px;min-width:220px;flex:1}
  .logo-btns{display:flex;gap:8px;flex-wrap:wrap}
  .err{color:var(--c4);font-size:.82rem;margin-top:8px;min-height:1em;display:block}

  main{padding:22px 0 80px}
  .tabs{display:flex;gap:6px;margin:8px 0 24px;border-bottom:1px solid var(--line)}
  .tab{font-family:var(--fd);font-weight:600;padding:12px 18px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;background:none;border:none;font-size:.95rem}
  .tab.active{color:var(--ink);border-bottom-color:var(--ct)}
  .panel{display:none}
  .panel.active{display:block}
  .card{background:linear-gradient(180deg,var(--surface),var(--bg-2));border:1px solid var(--line);border-radius:6px;padding:clamp(20px,3vw,30px);margin-bottom:20px}
  .card h2{font-size:1.15rem;margin-bottom:4px}
  .card .sub{color:var(--muted);font-size:.88rem;margin-bottom:20px}

  .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  .count{font-family:var(--fd);color:var(--muted);font-size:.88rem}
  .count b{color:var(--ct)}
  .tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
  table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:820px}
  th,td{text-align:left;padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-family:var(--fd);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--bg-2);position:sticky;top:0}
  tr:hover td{background:rgba(255,255,255,.02)}
  .tag-pill{font-family:var(--fd);font-weight:700;font-size:.72rem;color:var(--ct);border:1px solid var(--ct);padding:2px 7px;border-radius:2px}
  .empty{text-align:center;color:var(--muted);padding:40px}
  .players-cell{color:#aeb9c7;font-size:.8rem}
  .uid-box{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line-strong);border-radius:3px;padding:4px 10px;color:var(--t);user-select:all}

  .ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .gcell{background:var(--bg);border:1px solid var(--line);border-radius:5px;overflow:hidden;display:flex;flex-direction:column}
  .gcell .thumb{aspect-ratio:4/3;background:var(--bg-2);overflow:hidden}
  .gcell .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .gcell .meta{padding:8px 10px;font-size:.78rem;flex:1}
  .gcell .meta .ed{color:var(--t);font-family:var(--fd);font-size:.7rem;letter-spacing:.06em}
  .gcell .meta .cp{color:#c3ccd9;margin-top:2px;word-break:break-word}
  .gcell .act{padding:0 10px 10px}

  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,140%);background:var(--surface-2);border:1px solid var(--ct);border-left:3px solid var(--ct);padding:13px 18px;border-radius:4px;z-index:100;box-shadow:0 20px 46px -18px rgba(0,0,0,.8);transition:transform .35s cubic-bezier(.2,.8,.2,1);font-size:.9rem;max-width:90vw}
  .toast.show{transform:translate(-50%,0)}
  .toast.bad{border-color:var(--c4);border-left-color:var(--c4)}

  [hidden]{display:none!important}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="bar">
  <div class="wrap bar-in">
    <div class="brand"><span class="mark" id="adminMark">FX</span><span>后台管理<small>CS2 CUP · ADMIN</small></span></div>
    <div id="barRight"></div>
  </div>
</div>

<div class="wrap"><div id="connBanner"></div></div>

<!-- 登录 -->
<div id="loginView" class="wrap" hidden>
  <form class="login" id="loginForm">
    <h1>管理员登录</h1>
    <p>仅数据库管理员白名单中的账号可进入后台。账号创建与授权请在 CloudBase 控制台完成。</p>
    <div class="field"><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" placeholder="you@example.com" /></div>
    <div class="field"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" placeholder="登录密码" /></div>
    <span class="err" id="loginErr"></span>
    <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center" id="loginBtn">登录</button>
  </form>
</div>

<!-- 控制台 -->
<main id="dashView" class="wrap" hidden>
  <div id="uidBanner"></div>
  <div class="tabs">
    <button class="tab active" data-tab="event">赛事信息</button>
    <button class="tab" data-tab="teams">报名管理</button>
    <button class="tab" data-tab="gallery">往届相册</button>
  </div>

  <!-- 赛事信息 -->
  <section class="panel active" id="panel-event">
    <div class="card">
      <h2>赛事信息</h2>
      <div class="sub">这里改动的内容会显示在公开报名页。开赛日期决定倒计时和赛程时间表的起点。</div>
      <form id="eventForm">
        <div class="grid2">
          <div class="field"><label for="clubName">社团名称</label><input id="clubName" placeholder="例:锋线电竞社" maxlength="30" /></div>
          <div class="field"><label for="school">主办单位 / 学校</label><input id="school" placeholder="例:XX 大学" maxlength="40" /></div>
        </div>
        <div class="field">
          <label>社徽 / 头像 <span class="hint">显示在页眉、页脚的小图标,方形最佳;上传后会自动压缩</span></label>
          <div class="logo-row">
            <span class="logo-preview" id="logoPreview">FX</span>
            <div class="logo-ctrl">
              <div class="logo-btns">
                <button type="button" class="btn btn-ghost btn-mini" id="logoPick">上传图片</button>
                <button type="button" class="btn btn-ghost btn-mini" id="logoClear" hidden>移除</button>
              </div>
              <input id="logoLink" placeholder="或粘贴图片网址 https://…(选填)" />
              <input id="logoFile" type="file" accept="image/*" hidden />
              <input id="logoUrl" type="hidden" />
            </div>
          </div>
        </div>
        <div class="field"><label for="title">赛事名称 <span class="hint">显示在浏览器标签、页脚、对阵卡</span></label><input id="title" placeholder="例:CS2 校园杯 · 2026 春季赛" maxlength="40" /></div>
        <div class="grid2">
          <div class="field"><label for="heroTop">首页大标题·上行 <span class="hint">白色</span></label><input id="heroTop" placeholder="例:CS2" maxlength="16" /></div>
          <div class="field"><label for="heroBottom">首页大标题·下行 <span class="hint">蓝金渐变</span></label><input id="heroBottom" placeholder="例:校园杯" maxlength="16" /></div>
        </div>
        <div class="field"><label for="eyebrow">小标签 <span class="hint">标题上方的短标</span></label><input id="eyebrow" placeholder="例:// 校园 CS2 公开赛 · 2026 春季" maxlength="50" /></div>
        <div class="field"><label for="lede">副标题 <span class="hint">一句话介绍</span></label><textarea id="lede" rows="2" maxlength="120" placeholder="例:十六支战队,单败淘汰……"></textarea></div>
        <div class="grid3">
          <div class="field"><label for="startDate">开赛日期时间</label><input id="startDate" type="datetime-local" /></div>
          <div class="field"><label for="regDeadline">报名截止 <span class="hint">选填</span></label><input id="regDeadline" type="datetime-local" /></div>
          <div class="field"><label for="teamCap">参赛名额</label><input id="teamCap" type="number" min="2" max="128" value="16" /></div>
        </div>
        <div class="grid2">
          <div class="field"><label for="contactQQ">QQ 群号</label><input id="contactQQ" placeholder="报名咨询群" maxlength="30" /></div>
          <div class="field"><label for="contactWechat">负责人微信</label><input id="contactWechat" placeholder="微信号" maxlength="30" /></div>
        </div>
        <div class="field">
          <label for="rulesText">赛制规则 <span class="hint">每行一条:「小标签|标题|说明」(小标签选填),留空则用默认</span></label>
          <textarea id="rulesText" rows="6" placeholder="赛制|单败淘汰|每轮 BO3,总决赛 BO5&#10;地图|现役七图|赛前 Ban/Pick 定图&#10;资格|在校学生|每人限报一队,凭学生证参赛"></textarea>
        </div>
        <div class="field">
          <label for="faqText">须知 / 常见问题 <span class="hint">每行一条:「问题|答案」,留空则用默认</span></label>
          <textarea id="faqText" rows="6" placeholder="报名截止到什么时候?|名额满即截止,先到先得。&#10;凑不齐五人可以报名吗?|可以先占位,开赛前补齐首发即可。&#10;比赛在哪里进行?|线下电竞教室,具体时间地点另行通知。"></textarea>
        </div>
        <div class="field"><label for="mapPool">地图池 <span class="hint">逗号分隔,选填</span></label>
          <input id="mapPool" placeholder="Mirage,Inferno,Nuke,Overpass,Ancient,Anubis,Dust II" /></div>
        <span class="err" id="eventErr"></span>
        <button type="submit" class="btn btn-primary" id="saveEventBtn">保存赛事信息</button>
      </form>
    </div>
  </section>

  <!-- 报名管理 -->
  <section class="panel" id="panel-teams">
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0">报名战队</h2>
        <span class="count" id="teamCount"></span>
        <span style="flex:1"></span>
        <input id="search" placeholder="搜索战队 / 队长 / 学院…" style="max-width:260px" />
        <button class="btn btn-ghost" id="refreshBtn">刷新</button>
        <button class="btn btn-primary" id="exportBtn">导出 CSV</button>
      </div>
      <div class="tbl-scroll">
        <table>
          <thead><tr>
            <th>种子</th><th>TAG</th><th>战队</th><th>队长</th><th>联系方式</th><th>学院</th><th>队员</th><th>报名时间</th><th></th>
          </tr></thead>
          <tbody id="teamRows"><tr><td colspan="9" class="empty">加载中…</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- 往届相册 -->
  <section class="panel" id="panel-gallery">
    <div class="card">
      <h2>上传往届照片</h2>
      <div class="sub">照片会展示在公开页的「往届赛事」。先填「届次」把同一届的照片归到一组,再选择一张或多张照片。图片上传时会自动压缩,建议整体控制在几十张以内即可。</div>
      <div class="grid2">
        <div class="field"><label for="gEdition">届次 / 分组 <span class="hint">例:2025 秋季赛(留空归到「往届相册」)</span></label><input id="gEdition" placeholder="例:2025 秋季赛" maxlength="30" /></div>
        <div class="field"><label for="gCaption">照片说明 <span class="hint">选填,应用于本次选择的照片</span></label><input id="gCaption" placeholder="例:总决赛现场" maxlength="60" /></div>
      </div>
      <div class="field" style="margin-bottom:0">
        <input id="gFile" type="file" accept="image/*" multiple hidden />
        <button type="button" class="btn btn-primary" id="gPick">选择照片上传</button>
        <span class="muted fd" id="gProgress" style="margin-left:12px;font-size:.85rem"></span>
      </div>
      <span class="err" id="gErr"></span>
    </div>
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0">已上传照片</h2>
        <span class="count" id="gCount"></span>
        <span style="flex:1"></span>
        <button class="btn btn-ghost" id="gRefresh">刷新</button>
      </div>
      <div id="gGrid"></div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script src="https://static.cloudbase.net/cloudbase-js-sdk/3.8.2/cloudbase.full.js"></script>
<script src="config.js?v=20260826-security2"></script>
<script src="lc.js?v=20260826-security2"></script>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function toast(msg,bad){var t=$("toast");t.textContent=msg;t.className="toast show"+(bad?" bad":"");setTimeout(function(){t.className="toast";},3400);}

  function showConn(){
    var b=$("connBanner");
    if(!window.LC || !LC.ready){
      b.innerHTML='<div class="banner warn"><span>⚠️</span><span>后台未连接云端:<b>'+esc((window.LC&&LC.reason)||"未知")+
        '</b>。请先按教程编辑 <code>config.js</code> 填入 环境ID 和 Publishable Key 后刷新本页。</span></div>';
      return false;
    }
    return true;
  }

  // ---------- event ----------
  var EV_FIELDS=["clubName","school","title","heroTop","heroBottom","eyebrow","lede","teamCap","contactQQ","contactWechat","rulesText","faqText","mapPool"];
  var currentEventId=null;

  function toLocalInput(d){ if(!d) return ""; var p=function(n){return(n<10?"0":"")+n;};
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"T"+p(d.getHours())+":"+p(d.getMinutes()); }
  function fillEventForm(ev){
    EV_FIELDS.forEach(function(k){ var el=$(k); if(el) el.value = ev && ev[k]!=null ? ev[k] : (k==="teamCap"?16:""); });
    $("startDate").value = ev && ev.startDate ? toLocalInput(new Date(ev.startDate)) : "";
    $("regDeadline").value = ev && ev.regDeadline ? toLocalInput(new Date(ev.regDeadline)) : "";
    if(!$("teamCap").value) $("teamCap").value=16;
    setLogo(ev && ev.logoUrl ? ev.logoUrl : "");
    $("logoLink").value = (ev && ev.logoUrl && /^https?:/i.test(ev.logoUrl)) ? ev.logoUrl : "";
  }
  function loadEvent(){
    return LC.getEvent().then(function(ev){ currentEventId = ev? ev.id : null; fillEventForm(ev); })
      .catch(function(err){ $("eventErr").textContent="读取赛事信息失败:"+(err.message||err); });
  }
  $("eventForm").addEventListener("submit",function(e){
    e.preventDefault(); $("eventErr").textContent="";
    var data={}; EV_FIELDS.forEach(function(k){ data[k]=$(k).value.trim(); });
    data.teamCap=parseInt($("teamCap").value,10)||16;
    data.startDate=$("startDate").value?new Date($("startDate").value).toISOString():"";
    data.regDeadline=$("regDeadline").value?new Date($("regDeadline").value).toISOString():"";
    data.logoUrl=$("logoUrl").value||"";
    var btn=$("saveEventBtn"); btn.disabled=true; btn.textContent="保存中…";
    LC.saveEvent(data,currentEventId).then(function(id){ currentEventId=id; toast("赛事信息已保存 ✔"); })
      .catch(function(err){ $("eventErr").textContent="保存失败:"+(err.message||err)+"(若提示无权限 / permission denied,多半是数据库初始化.sql 还没在「SQL 编辑器」里跑过)"; })
      .then(function(){ btn.disabled=false; btn.textContent="保存赛事信息"; });
  });

  // ---------- logo / 头像 ----------
  function setLogo(val){
    $("logoUrl").value = val || "";
    var box=$("logoPreview");
    while(box.firstChild) box.removeChild(box.firstChild);
    if(val){
      var img=document.createElement("img"); img.src=val; img.alt="";
      box.appendChild(img); box.classList.add("has-img");
      $("logoClear").hidden=false;
    }else{
      box.textContent="FX"; box.classList.remove("has-img");
      $("logoClear").hidden=true;
    }
    // 同步后台顶栏图标
    var am=$("adminMark"); if(am){ while(am.firstChild) am.removeChild(am.firstChild);
      if(val){ var i2=document.createElement("img"); i2.src=val; i2.alt=""; am.appendChild(i2); am.classList.add("has-img"); }
      else { am.textContent="FX"; am.classList.remove("has-img"); } }
  }
  // 读取图片文件 → 等比缩放到 ≤256px → 压缩成 dataURL(避免存进数据库的体积过大)
  function fileToLogoDataURL(file){
    return new Promise(function(resolve,reject){
      if(!file || !/^image\//.test(file.type)) return reject(new Error("请选择图片文件"));
      var reader=new FileReader();
      reader.onerror=function(){ reject(new Error("读取失败")); };
      reader.onload=function(){
        var img=new Image();
        img.onerror=function(){ reject(new Error("图片无法解析,换一张试试")); };
        img.onload=function(){
          var m=256, s=Math.min(1, m/Math.max(img.width,img.height));
          var w=Math.max(1,Math.round(img.width*s)), h=Math.max(1,Math.round(img.height*s));
          var c=document.createElement("canvas"); c.width=w; c.height=h;
          c.getContext("2d").drawImage(img,0,0,w,h);
          var out; try{ out=c.toDataURL("image/png"); }catch(err){ return reject(new Error("处理失败")); }
          if(out.length>180000) out=c.toDataURL("image/jpeg",0.85); // 太大改用 jpeg
          resolve(out);
        };
        img.src=reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  $("logoPick").addEventListener("click",function(){ $("logoFile").click(); });
  $("logoFile").addEventListener("change",function(){
    var f=this.files && this.files[0]; if(!f) return;
    $("eventErr").textContent="";
    fileToLogoDataURL(f).then(function(url){ setLogo(url); $("logoLink").value=""; toast("图片已就绪,别忘了点保存"); })
      .catch(function(err){ $("eventErr").textContent="图片处理失败:"+(err.message||err); });
    this.value=""; // 允许重复选同一文件
  });
  $("logoLink").addEventListener("change",function(){
    var v=this.value.trim();
    if(v && !/^https?:\/\//i.test(v)){ $("eventErr").textContent="图片网址要以 http:// 或 https:// 开头"; return; }
    $("eventErr").textContent=""; if(v) setLogo(v);
  });
  $("logoClear").addEventListener("click",function(){ setLogo(""); $("logoLink").value=""; toast("已移除,点保存生效"); });

  // ---------- teams ----------
  var allTeams=[];
  function fmtTime(d){ if(!d) return "—"; var p=function(n){return(n<10?"0":"")+n;}; return (d.getMonth()+1)+"/"+d.getDate()+" "+p(d.getHours())+":"+p(d.getMinutes()); }
  function renderTeams(){
    var kw=$("search").value.trim().toLowerCase();
    var rows=allTeams.filter(function(t){ return !kw || [t.name,t.tag,t.captain,t.dept].join(" ").toLowerCase().indexOf(kw)>=0; });
    $("teamCount").innerHTML="共 <b>"+allTeams.length+"</b> 支"+(kw?(" · 匹配 "+rows.length):"");
    var tb=$("teamRows");
    if(!rows.length){ tb.innerHTML='<tr><td colspan="9" class="empty">'+(allTeams.length?"没有匹配的战队":"还没有战队报名")+'</td></tr>'; return; }
    tb.innerHTML=rows.map(function(t){
      return '<tr>'+
        '<td class="fd">#'+(t.seed||"")+'</td>'+
        '<td><span class="tag-pill">'+esc(t.tag)+'</span></td>'+
        '<td class="fd">'+esc(t.name)+'</td>'+
        '<td>'+esc(t.captain)+'</td>'+
        '<td>'+esc(t.contact)+'</td>'+
        '<td>'+esc(t.dept||"—")+'</td>'+
        '<td class="players-cell">'+esc((t.players||[]).join("、"))+'</td>'+
        '<td class="muted">'+fmtTime(t.createdAt)+'</td>'+
        '<td><button class="btn btn-danger" data-del="'+t.id+'" data-name="'+esc(t.name)+'">删除</button></td>'+
      '</tr>';
    }).join("");
  }
  function loadTeams(){
    $("teamRows").innerHTML='<tr><td colspan="9" class="empty">加载中…</td></tr>';
    return LC.listTeamsAdmin().then(function(list){ allTeams=list; renderTeams(); })
      .catch(function(err){ $("teamRows").innerHTML='<tr><td colspan="9" class="empty">加载失败:'+esc(err.message||String(err))+'</td></tr>'; });
  }
  $("search").addEventListener("input",renderTeams);
  $("refreshBtn").addEventListener("click",loadTeams);
  $("teamRows").addEventListener("click",function(e){
    var btn=e.target.closest("[data-del]"); if(!btn) return;
    var id=btn.getAttribute("data-del"), name=btn.getAttribute("data-name");
    if(!confirm("确认删除战队「"+name+"」的报名?此操作不可撤销。")) return;
    btn.disabled=true;
    LC.deleteTeam(id).then(function(){ allTeams=allTeams.filter(function(t){return String(t.id)!==String(id);}); renderTeams(); toast("已删除「"+name+"」"); })
      .catch(function(err){ btn.disabled=false; toast("删除失败:"+(err.message||err),true); });
  });
  $("exportBtn").addEventListener("click",function(){
    if(!allTeams.length){ toast("暂无报名可导出",true); return; }
    var head=["种子","战队名称","TAG","队长","联系方式","学院","队员","备注","报名时间"];
    var lines=[head.join(",")];
    function csvCell(v){
      v=String(v==null?"":v);
      if(/^[\t\r\n ]*[=+\-@]/.test(v)) v="'"+v;
      return '"'+v.replace(/"/g,'""')+'"';
    }
    allTeams.forEach(function(t){
      var row=[t.seed||"",t.name,t.tag,t.captain,t.contact,t.dept||"",(t.players||[]).join("、"),t.note||"",fmtTime(t.createdAt)];
      lines.push(row.map(csvCell).join(","));
    });
    var blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="报名名单_"+allTeams.length+"队.csv"; a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
    toast("已导出 "+allTeams.length+" 支战队");
  });

  // ---------- gallery / 往届相册 ----------
  var galleryItems=[];
  // 读取图片文件 → 等比缩放并压缩成 JPEG dataURL(尽量压到目标体积内)
  function fileToPhotoDataURL(file){
    return new Promise(function(resolve,reject){
      if(!file || !/^image\//.test(file.type)) return reject(new Error("不是图片文件"));
      var reader=new FileReader();
      reader.onerror=function(){ reject(new Error("读取失败")); };
      reader.onload=function(){
        var img=new Image();
        img.onerror=function(){ reject(new Error("图片无法解析,换一张试试")); };
        img.onload=function(){
          var TARGET=430000;            // dataURL 字符上限 ≈ 320KB
          var dims=[1600,1280,1024,800], qs=[0.82,0.72,0.62,0.5];
          var best=null;
          for(var di=0; di<dims.length; di++){
            var m=dims[di], s=Math.min(1, m/Math.max(img.width,img.height));
            var w=Math.max(1,Math.round(img.width*s)), h=Math.max(1,Math.round(img.height*s));
            var c=document.createElement("canvas"); c.width=w; c.height=h;
            c.getContext("2d").drawImage(img,0,0,w,h);
            for(var qi=0; qi<qs.length; qi++){
              var out; try{ out=c.toDataURL("image/jpeg",qs[qi]); }catch(err){ return reject(new Error("处理失败")); }
              if(!best || out.length<best.length) best=out;
              if(out.length<=TARGET) return resolve(out);
            }
          }
          resolve(best); // 实在压不到目标就用最小的那个
        };
        img.src=reader.result;
      };
      reader.readAsDataURL(file);
    });
  }
  function renderGallery(){
    $("gCount").innerHTML="共 <b>"+galleryItems.length+"</b> 张";
    if(!galleryItems.length){ $("gGrid").innerHTML='<div class="empty">还没有上传往届照片。用上方「选择照片上传」添加。</div>'; return; }
    $("gGrid").innerHTML='<div class="ggrid">'+galleryItems.map(function(p){
      return '<div class="gcell">'+
        '<div class="thumb">'+(p.url?'<img loading="lazy" src="'+esc(p.url)+'" alt="">':'')+'</div>'+
        '<div class="meta"><div class="ed">'+esc(p.edition||"往届相册")+'</div><div class="cp">'+esc(p.caption||"(无说明)")+'</div></div>'+
        '<div class="act"><button class="btn btn-danger btn-mini" data-gdel="'+p.id+'">删除</button></div>'+
      '</div>';
    }).join("")+'</div>';
  }
  function loadGallery(){
    $("gGrid").innerHTML='<div class="empty">加载中…</div>';
    return LC.listGallery().then(function(list){ galleryItems=list; renderGallery(); })
      .catch(function(err){ $("gGrid").innerHTML='<div class="empty">加载失败:'+esc(err.message||String(err))+'</div>'; });
  }
  $("gPick").addEventListener("click",function(){ $("gFile").click(); });
  $("gFile").addEventListener("change",function(){
    var files=Array.prototype.slice.call(this.files||[]); this.value="";
    if(!files.length) return;
    $("gErr").textContent="";
    var edition=$("gEdition").value.trim(), caption=$("gCaption").value.trim();
    var pick=$("gPick"); pick.disabled=true;
    var done=0, fail=0, total=files.length, base=Date.now(), i=0;
    (function next(){
      if(i>=files.length){
        pick.disabled=false;
        $("gProgress").textContent="完成:成功 "+done+(fail?(" · 失败 "+fail):"")+" 张";
        toast("已上传 "+done+" 张照片"+(fail?("(失败 "+fail+")"):""), fail>0&&done===0);
        loadGallery();
        return;
      }
      var f=files[i], idx=i; i++;
      $("gProgress").textContent="处理中… "+(idx+1)+"/"+total;
      fileToPhotoDataURL(f).then(function(url){
        return LC.addGallery({ url:url, caption:caption, edition:edition, sort: base-idx });
      }).then(function(){ done++; })
        .catch(function(err){ fail++; $("gErr").textContent="部分照片失败:"+(err.message||err); })
        .then(next);
    })();
  });
  $("gRefresh").addEventListener("click",loadGallery);
  $("gGrid").addEventListener("click",function(e){
    var btn=e.target.closest("[data-gdel]"); if(!btn) return;
    var id=btn.getAttribute("data-gdel");
    if(!confirm("确认删除这张照片?此操作不可撤销。")) return;
    btn.disabled=true;
    LC.deleteGallery(id).then(function(){ galleryItems=galleryItems.filter(function(p){return String(p.id)!==String(id);}); renderGallery(); toast("已删除"); })
      .catch(function(err){ btn.disabled=false; toast("删除失败:"+(err.message||err),true); });
  });

  // ---------- tabs ----------
  document.querySelectorAll(".tab").forEach(function(tab){
    tab.addEventListener("click",function(){
      document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("active");});
      document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("active");});
      tab.classList.add("active"); $("panel-"+tab.getAttribute("data-tab")).classList.add("active");
    });
  });

  // ---------- auth ----------
  function showUidBanner(user){
    var uid=user && (user.id||user.uid||user.sub) || "";
    $("uidBanner").innerHTML='<div class="banner ok"><span>✅</span><span>已获后台管理员授权'+
      (user&&user.email?('(<b>'+esc(user.email)+'</b>)'):'')+'。权限由数据库的安全策略(RLS)自动判定,'+
      '<b>仅白名单 UID 可写入数据</b>。'+
      (uid?('<br><span class="muted" style="font-size:.82rem">账号 UID:<span class="uid-box" id="uidVal">'+esc(uid)+'</span> '+
      '<button class="btn btn-ghost btn-mini" id="copyUid" type="button">复制</button>(一般用不到,排错时可能会用)</span>'):'')+
      '</span></div>';
    var c=$("copyUid"); if(c) c.addEventListener("click",function(){
      var v=$("uidVal").textContent;
      if(navigator.clipboard) navigator.clipboard.writeText(v).then(function(){toast("UID 已复制");},function(){toast("复制失败,请手动选中",true);});
      else toast("请手动选中复制");
    });
  }
  function showDashboard(user){
    $("loginView").hidden=true; $("dashView").hidden=false;
    $("barRight").innerHTML='<span class="muted fd" style="font-size:.85rem;margin-right:14px">'+esc((user&&user.email)||"已登录")+'</span><button class="btn btn-ghost" id="logoutBtn">退出</button>';
    $("logoutBtn").addEventListener("click",function(){ LC.logout().then(function(){location.reload();}); });
    showUidBanner(user);
    loadEvent(); loadTeams(); loadGallery();
  }
  function showLogin(){ $("dashView").hidden=true; $("loginView").hidden=false; }
  function showAccessDenied(user){
    var uid=user && (user.id||user.uid||user.sub) || "(未取得 UID)";
    showLogin();
    $("loginErr").textContent="该账号未获后台授权。请让环境管理员将 UID 加入 cs2cup_admin 白名单："+uid;
    $("connBanner").innerHTML='<div class="banner warn"><span>⚠️</span><span>已登录但没有后台权限。UID：<b>'+esc(uid)+
      '</b>。请在 CloudBase SQL 控制台完成授权后重新登录。<button class="btn btn-ghost btn-mini" id="denyLogout" type="button">退出</button></span></div>';
    $("denyLogout").addEventListener("click",function(){ LC.logout().then(function(){ location.reload(); }); });
  }
  function openDashboardIfAdmin(user){
    return LC.isAdmin().then(function(ok){ if(ok) showDashboard(user); else showAccessDenied(user); });
  }

  // login
  $("loginForm").addEventListener("submit",function(e){
    e.preventDefault(); $("loginErr").textContent="";
    var email=$("email").value.trim(), pw=$("password").value;
    if(!email||!pw){ $("loginErr").textContent="请输入邮箱和密码"; return; }
    var btn=$("loginBtn"); btn.disabled=true; btn.textContent="登录中…";
    LC.login(email,pw).then(function(){ return LC.getUser(); }).then(function(user){ return openDashboardIfAdmin(user); })
      .catch(function(err){ $("loginErr").textContent="登录失败:"+(err.message||err); })
      .then(function(){ btn.disabled=false; btn.textContent="登录"; });
  });

  // ---------- boot ----------
  if(showConn()){
    LC.getSession().then(function(session){
      if(session){ return LC.getUser().then(function(user){ return user?openDashboardIfAdmin(user):showLogin(); }); }
      showLogin();
    }).catch(showLogin);
  }else{
    showLogin();
    document.querySelectorAll("#loginView input,#loginView button").forEach(function(el){ el.disabled=true; });
  }
})();
</script>
