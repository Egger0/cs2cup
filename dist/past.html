<!DOCTYPE html>
<html lang="zh-CN" class="boot">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>往届赛事 · CS2 校园杯</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Teko:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  html.boot body{visibility:hidden}
  :root{
    --bg:#0A0E16;--bg-2:#0D131F;--surface:#121A28;--surface-2:#17212F;
    --line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.16);
    --ink:#EAF0F7;--muted:#8593A6;--muted-2:#5E6B7D;
    --ct:#3D9BE9;--ct-dim:rgba(61,155,233,.14);
    --t:#E3A63A;--t-dim:rgba(227,166,58,.14);
    --c4:#E5484D;
    --font-display:"Chakra Petch","Noto Sans SC",system-ui,sans-serif;
    --font-body:"Noto Sans SC","Chakra Petch",system-ui,-apple-system,sans-serif;
    --font-stat:"Teko","Chakra Petch",sans-serif;
    --wrap:1200px;--pad:clamp(20px,5vw,48px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(1100px 620px at 12% -8%,rgba(61,155,233,.10),transparent 60%),radial-gradient(1000px 640px at 92% 4%,rgba(227,166,58,.09),transparent 62%)}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:var(--wrap);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad);width:100%}
  .eyebrow{font-family:var(--font-display);font-weight:600;font-size:.78rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:.6em}
  .eyebrow::before{content:"";width:26px;height:1px;background:var(--t)}

  .hud{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:linear-gradient(180deg,rgba(10,14,22,.92),rgba(10,14,22,.72));border-bottom:1px solid var(--line)}
  .hud-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
  .brand{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-weight:700;letter-spacing:.02em}
  .brand .mark{width:30px;height:30px;flex:none;display:grid;place-items:center;border:1.5px solid var(--ct);color:var(--ct);font-family:var(--font-display);font-weight:700;font-size:.8rem;clip-path:polygon(14% 0,100% 0,100% 86%,86% 100%,0 100%,0 14%)}
  .brand .mark.has-img{border:none}
  .brand .mark img{width:100%;height:100%;object-fit:cover;display:block}
  .brand small{display:block;font-family:var(--font-body);font-weight:500;font-size:.66rem;letter-spacing:.24em;color:var(--muted-2);text-transform:uppercase}
  .nav{display:flex;gap:6px}
  .nav a{font-family:var(--font-display);font-weight:500;font-size:.9rem;padding:8px 14px;color:var(--muted);border-radius:2px;transition:color .18s,background .18s}
  .nav a:hover{color:var(--ink);background:rgba(255,255,255,.05)}
  .nav a.here{color:var(--t)}
  .btn{font-family:var(--font-display);font-weight:600;font-size:.9rem;letter-spacing:.04em;padding:9px 16px;border-radius:2px;border:1px solid transparent;cursor:pointer;transition:transform .16s,box-shadow .16s,background .16s,border-color .16s;display:inline-flex;align-items:center;gap:8px}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
  .btn-ghost:hover{border-color:var(--ct);color:var(--ct);transform:translateY(-2px)}

  main{position:relative;z-index:1;flex:1 0 auto}
  .arch-hero{padding-top:clamp(46px,7vh,88px);padding-bottom:clamp(20px,3vh,34px)}
  .arch-hero h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.1rem,5.4vw,3.8rem);line-height:1.02;letter-spacing:-.01em;margin:16px 0 0}
  .arch-hero h1 .grad{background:linear-gradient(100deg,var(--ct),var(--t));-webkit-background-clip:text;background-clip:text;color:transparent}
  .arch-hero p{color:#c3ccd9;margin-top:16px;max-width:52ch}

  .arch-body{padding-bottom:clamp(50px,8vh,96px)}
  .arch-group{margin-top:clamp(30px,5vw,52px)}
  .arch-group>.gh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .arch-group>.gh h3{font-family:var(--font-display);font-weight:700;font-size:clamp(1.2rem,2.6vw,1.7rem);letter-spacing:.01em}
  .arch-group>.gh .cnt{font-family:var(--font-stat);font-size:1.5rem;color:var(--muted-2);line-height:1}
  .arch-group>.gh .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line-strong),transparent);min-width:30px}

  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:16px}
  .shot{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;transition:transform .16s,border-color .16s;display:flex;flex-direction:column}
  .shot:hover{transform:translateY(-3px);border-color:var(--line-strong)}
  .shot .frame{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--bg-2)}
  .shot .frame img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;transition:transform .3s}
  .shot:hover .frame img{transform:scale(1.04)}
  .shot .ph{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.28);font-family:var(--font-display);font-size:.74rem;letter-spacing:.2em;text-transform:uppercase}
  .shot .ph.g0{background:linear-gradient(135deg,#16283d,#0f1a2a)}
  .shot .ph.g1{background:linear-gradient(135deg,#2a2033,#161020)}
  .shot .ph.g2{background:linear-gradient(135deg,#12302a,#0d1a1a)}
  .shot .ph.g3{background:linear-gradient(135deg,#2f2418,#1a1410)}
  .shot .cap{padding:12px 14px;color:#c3ccd9;font-size:.88rem;border-top:1px solid var(--line);flex:1}
  .shot .cap.empty{color:var(--muted-2)}

  .empty{text-align:center;color:var(--muted);padding:64px 30px;border:1px dashed var(--line-strong);border-radius:8px;margin-top:24px}
  .empty .big{font-family:var(--font-display);font-weight:700;font-size:1.2rem;color:var(--ink);margin-bottom:10px}

  .banner{max-width:var(--wrap);margin:16px auto 0;padding:0 var(--pad);width:100%}
  .banner .in{background:var(--t-dim);border:1px solid rgba(227,166,58,.35);color:#f0d49b;border-radius:4px;padding:10px 14px;font-size:.86rem}

  /* lightbox */
  .lb{position:fixed;inset:0;z-index:100;background:rgba(6,9,14,.92);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .2s}
  .lb.show{display:flex;opacity:1}
  .lb img{max-width:min(1100px,92vw);max-height:82vh;border-radius:6px;box-shadow:0 40px 90px -30px rgba(0,0,0,.9);border:1px solid var(--line-strong)}
  .lb .cap{position:absolute;left:0;right:0;bottom:26px;text-align:center;color:#dfe6ef;font-size:.95rem;padding:0 20px;text-shadow:0 2px 8px rgba(0,0,0,.8)}
  .lb .x{position:absolute;top:18px;right:22px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line-strong);background:rgba(20,26,38,.7);color:var(--ink);font-size:1.4rem;cursor:pointer;display:grid;place-items:center;transition:border-color .16s,color .16s}
  .lb .x:hover{border-color:var(--c4);color:var(--c4)}

  footer{border-top:1px solid var(--line);padding:40px 0 36px;position:relative;z-index:1;flex-shrink:0}
  .foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
  .foot .contact{color:var(--muted);font-size:.9rem;line-height:1.9}
  .foot .contact b{color:var(--ink);font-family:var(--font-display)}
  .foot .callsign{font-family:var(--font-display);color:var(--muted-2);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase}
  .datasrc{font-size:.72rem;color:var(--muted-2);margin-top:14px;font-family:var(--font-display);letter-spacing:.08em}

  .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:none}

  @media(max-width:760px){.nav{display:none}.brand small{display:none}}
  a:focus-visible,button:focus-visible{outline:2px solid var(--t);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="hud">
  <div class="wrap hud-inner">
    <a href="index.html" class="brand">
      <span class="mark" id="brandMark">FX</span>
      <span><span id="brandName">锋线电竞社</span><small id="brandEn">Frontline Esports · CS2</small></span>
    </a>
    <nav class="nav">
      <a href="index.html#register">报名</a><a href="index.html#teams">参赛战队</a><a href="index.html#bracket">对阵赛程</a><a href="index.html#rules">赛制规则</a><a href="index.html#faq">须知</a><a href="past.html" class="here">往届赛事</a>
    </nav>
    <a href="index.html#register" class="btn btn-ghost">← 返回报名</a>
  </div>
</header>

<script>
/* 防闪烁:用上次缓存的社名/logo 立即渲染页头,云端数据到达后再更新 */
(function(){try{
  var b=JSON.parse(localStorage.getItem("cs2cup_brand")||"null"); if(!b) return;
  var nm=document.getElementById("brandName"); if(nm&&b.clubName) nm.textContent=b.clubName;
  var en=document.getElementById("brandEn"); if(en&&b.brandEn) en.textContent=b.brandEn;
  var mk=document.getElementById("brandMark");
  if(mk){
    if(b.logoUrl){ mk.textContent=""; var im=new Image(); im.alt=""; im.src=b.logoUrl; mk.appendChild(im); mk.classList.add("has-img"); }
    else if(b.brandMark){ mk.textContent=b.brandMark; }
  }
}catch(e){}})();
</script>

<main>
  <section class="arch-hero">
    <div class="wrap reveal in">
      <span class="eyebrow">// 赛事回顾 · 历届精彩瞬间</span>
      <h1>往届<span class="grad">赛事回顾</span></h1>
      <p id="archLede">回顾历届 CS2 校园杯的高光时刻——总决赛现场、冠军战队、名场面与观众席应援,都在这里。</p>

  <div class="banner" id="banner" hidden><div class="in" id="bannerMsg"></div></div>

  <section class="arch-body">
    <div class="wrap">
      <div id="gallery"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot">
    <div>
      <div class="brand" style="margin-bottom:14px"><span class="mark" id="footMark">FX</span><span id="footBrand">锋线电竞社</span></div>
      <div class="contact">
        赛事咨询 · 报名答疑<br>
        QQ 群:<b id="footQQ">【替换为你的群号】</b><br>
        负责人微信:<b id="footWechat">【替换为微信号】</b>
      </div>
    </div>
    <div class="contact" style="text-align:right">
      <span class="callsign">// Frontline Esports Club</span><br>
      <a href="index.html" style="color:var(--ct);font-family:var(--font-display);font-size:.82rem;letter-spacing:.06em">返回主页 · 报名 →</a><br><br>
      <span id="footSchool">本赛事由 XX 大学锋线电竞社主办</span><br>
      <span id="footCopy">© 2026 锋线电竞社 · CS2 校园杯</span>
      <div class="datasrc" id="dataSrc"></div>

  </div>
</footer>

<div class="lb" id="lightbox" role="dialog" aria-modal="true" aria-label="照片查看">
  <button class="x" id="lbClose" aria-label="关闭">×</button>
  <img id="lbImg" src="" alt="" />
  <div class="cap" id="lbCap"></div>
</div>

<script>
/* 防闪烁:用上次缓存的赛事配置立即渲染页脚品牌,云端数据到达后再更新 */
(function(){var c=null;try{c=JSON.parse(localStorage.getItem("cs2cup_state")||"null");}catch(e){}
window.__CS2CUP_STATE=c;
try{
  var $=function(id){return document.getElementById(id);};
  if(c){
    if(c.clubName){var bn=$("brandName");if(bn)bn.textContent=c.clubName;
      document.title="往届赛事 · "+(c.clubName||"CS2 校园杯");}
    if(c.brandEn){var be=$("brandEn");if(be)be.textContent=c.brandEn;}
    if(c.logoUrl){var mk=$("brandMark");if(mk){mk.textContent="";var im=new Image();im.alt="";im.src=c.logoUrl;mk.appendChild(im);mk.classList.add("has-img");}}
    if(c.contactQQ){var qq=$("footQQ");if(qq)qq.textContent=c.contactQQ;}
    if(c.contactWechat){var wx=$("footWechat");if(wx)wx.textContent=c.contactWechat;}
    if(c.school&&c.clubName){var fs2=$("footSchool");if(fs2)fs2.textContent="本赛事由 "+c.school+c.clubName+"主办";}
    if(c.title){var fc=$("footCopy");if(fc)fc.textContent="© "+(new Date().getFullYear())+" "+(c.clubName||"")+" · "+c.title;}
  }
}catch(e){}
var r=document.documentElement;if(r)r.classList.remove("boot");})();
</script>
<script src="https://static.cloudbase.net/cloudbase-js-sdk/3.8.2/cloudbase.full.js"></script>
<script src="config.js?v=20260826-operations1"></script>
<script src="lc.js?v=20260826-operations1"></script>
<script>
(function(){
  "use strict";
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  var DEF={
    clubName:"锋线电竞社", brandEn:"Frontline Esports · CS2", school:"XX 大学",
    title:"CS2 校园杯 · 2026 春季赛",
    contactQQ:"【替换为你的群号】", contactWechat:"【替换为微信号】",
    logoUrl:"", brandMark:"FX"
  };
  var CLOUD_CONFIGURED=!!(window.LC&&LC.ready);
  var CFG=Object.assign({},DEF), MODE=CLOUD_CONFIGURED?"loading":"demo";
  // 读取上次缓存的品牌作为初始值,避免加载中/离线回退成默认社名(防页头闪烁)
  try{ var _bc=JSON.parse(localStorage.getItem("cs2cup_brand")||"null");
    if(_bc){ ["clubName","brandEn","logoUrl","brandMark"].forEach(function(k){ if(_bc[k]!=null&&_bc[k]!=="") CFG[k]=_bc[k]; }); }
  }catch(e){}

  // 演示模式下的占位样例(无真实图片,渐变色块展示排版)
  var demoGallery=[
    {edition:"2025 秋季赛",caption:"总决赛现场 · 冠军战队捧杯"},
    {edition:"2025 秋季赛",caption:"半决赛决胜图 · 最后一个残局"},
    {edition:"2025 秋季赛",caption:"观众席应援与解说台"},
    {edition:"2025 春季赛",caption:"开幕式合影"},
    {edition:"2025 春季赛",caption:"MVP 颁奖时刻"},
    {edition:"2025 春季赛",caption:"小组赛激战"}
  ];

  function setMark(el){
    if(!el) return;
    while(el.firstChild) el.removeChild(el.firstChild);
    if(CFG.logoUrl){
      var img=document.createElement("img"); img.src=CFG.logoUrl; img.alt="";
      el.appendChild(img); el.classList.add("has-img");
    }else{ el.textContent=CFG.brandMark||"FX"; el.classList.remove("has-img"); }
  }
  function applyBrand(){
    document.title="往届赛事 · "+CFG.clubName;
    $("brandName").textContent=CFG.clubName;
    $("brandEn").textContent=CFG.brandEn||DEF.brandEn;
    setMark($("brandMark")); setMark($("footMark"));
    $("footBrand").textContent=CFG.clubName;
    $("footQQ").textContent=CFG.contactQQ;
    $("footWechat").textContent=CFG.contactWechat;
    $("footSchool").textContent="本赛事由 "+CFG.school+CFG.clubName+"主办";
    $("footCopy").textContent="© "+(new Date().getFullYear())+" "+CFG.clubName+" · "+CFG.title;
    $("dataSrc").textContent=(MODE==="cloud")?"数据源:云端 · CloudBase":
      (MODE==="loading")?"数据源:正在连接云端":
      (MODE==="offline")?"数据源:云端暂不可用":"数据源:演示模式(未连接云端)";
  }
  function applyEvent(ev){
    if(!ev) return;
    ["clubName","school","title","contactQQ","contactWechat","logoUrl"].forEach(function(k){
      if(ev[k]!=null && String(ev[k]).trim()!=="") CFG[k]=ev[k];
    });
    saveState(ev);
  }
  // 缓存:cs2cup_brand 供页头防闪烁脚本;cs2cup_state 保存完整赛事配置,下次刷新首屏直接渲染
  function saveState(ev){ try{ localStorage.setItem("cs2cup_brand",
    JSON.stringify({clubName:CFG.clubName, brandEn:CFG.brandEn, logoUrl:CFG.logoUrl, brandMark:CFG.brandMark}));
    if(ev) localStorage.setItem("cs2cup_state", JSON.stringify(ev)); }catch(e){} }

  function groupByEdition(photos){
    var order=[], map={};
    photos.forEach(function(p){
      var key=p.edition||"";
      if(!(key in map)){ map[key]=[]; order.push(key); }
      map[key].push(p);
    });
    return order.map(function(k){ return {edition:k, photos:map[k]}; });
  }
  function shotHTML(p,idx){
    var capCls=p.caption?"cap":"cap empty";
    var capTxt=p.caption?esc(p.caption):"(未命名)";
    var frame;
    if(p.url){
      frame='<div class="frame"><img loading="lazy" src="'+esc(p.url)+'" alt="'+esc(p.caption||"往届照片")+'" data-full="'+esc(p.url)+'" data-cap="'+esc(p.caption||"")+'"></div>';
    }else{
      frame='<div class="frame"><div class="ph g'+(idx%4)+'">CS2 · 往届</div></div>';
    }
    return '<figure class="shot">'+frame+'<figcaption class="'+capCls+'">'+capTxt+'</figcaption></figure>';
  }
  function renderGallery(photos){
    var host=$("gallery");
    if(!photos || !photos.length){
      host.innerHTML='<div class="empty"><div class="big">往届照片正在整理中</div>历届比赛的精彩照片会在这里陆续上线,敬请期待。</div>';
      return;
    }
    var groups=groupByEdition(photos), gi=0, html="";
    groups.forEach(function(g){
      var title=g.edition||"往届相册";
      html+='<div class="arch-group reveal"><div class="gh"><h3>'+esc(title)+'</h3>'+
            '<span class="cnt">'+g.photos.length+'</span><span class="line"></span></div><div class="shots">';
      g.photos.forEach(function(p){ html+=shotHTML(p,gi++); });
      html+='</div></div>';
    });
    host.innerHTML=html;
    document.querySelectorAll(".reveal").forEach(function(el){ io.observe(el); });
  }

  // lightbox
  var lb=$("lightbox"), lbImg=$("lbImg"), lbCap=$("lbCap");
  function openLB(src,cap){ lbImg.src=src; lbCap.textContent=cap||""; lb.classList.add("show"); }
  function closeLB(){ lb.classList.remove("show"); lbImg.src=""; }
  $("gallery").addEventListener("click",function(e){
    var img=e.target.closest ? e.target.closest("img[data-full]") : null;
    if(img){ openLB(img.getAttribute("data-full"), img.getAttribute("data-cap")); }
  });
  $("lbClose").addEventListener("click",closeLB);
  lb.addEventListener("click",function(e){ if(e.target===lb) closeLB(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeLB(); });

  var io=new IntersectionObserver(function(es){ es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target);} }); },{threshold:.08});
  document.querySelectorAll(".reveal").forEach(function(el){ io.observe(el); });

  function showBanner(msg){ $("bannerMsg").textContent=msg; $("banner").hidden=false; }

  // boot
  // 用上次缓存的赛事配置立即合并(避免刷新闪回默认),云端数据到达后再更新
  var _st = window.__CS2CUP_STATE;
  if(_st){ try{ applyEvent(_st); }catch(e){} }
  if(window.LC && LC.ready){
    Promise.resolve(LC.ensureAuth()).catch(function(){})
      .then(function(){ return LC.getEvent(); })
      .then(function(ev){ applyEvent(ev); }).catch(function(){})
      .then(function(){ return LC.listGallery(); })
      .then(function(list){ MODE="cloud"; applyBrand(); renderGallery(list||[]); })
      .catch(function(err){
        MODE="offline"; applyBrand();
        showBanner("暂时无法从云端加载照片,请稍后刷新。"+(err&&err.message?"("+err.message+")":""));
        renderGallery([]);
      });
  }else{
    MODE="demo"; applyBrand();
    showBanner("演示模式:未连接云端。以下为版式样例,连接云端并在后台上传后即显示真实照片。");
    renderGallery(demoGallery);
  }
})();
</script>
</body>
</html>
