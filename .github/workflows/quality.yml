---
name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static and unit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run deterministic unit tests
        run: |
          npm run test:seeding
          npm run test:schedule
          npm run test:registration-fingerprint
          npm run test:photo-storage-config
          npm run test:photo-storage-security
          npm run test:pack-standalone
          npm run test:object-cleanup
          npm run test:rdb-endpoint
          npm run test:cache-boundaries
          npm run test:session-token
          npm run test:cloudbase-environment
          npm run test:site-config
          npm run test:migration-checksum
          npm run test:migration-state

  container:
    name: Production container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Build production image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3100 \
            --tag cs2cup:quality \
            .

      - name: Build with CloudBase-compatible defaults
        run: docker build --tag cs2cup:quality-default .

      - name: Start and verify production image
        run: |
          container_name="cs2cup-quality-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker logs "$container_name" >"${RUNNER_TEMP}/container.log" 2>&1 || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          test "$(docker image inspect cs2cup:quality --format '{{.Config.User}}')" = "nextjs"
          docker run \
            --detach \
            --name "$container_name" \
            --publish 127.0.0.1:3100:3000 \
            --env HOME_PREVIEW_COUNTDOWN=1 \
            cs2cup:quality >/dev/null

          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3100/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3100/ >/dev/null
          curl --fail --silent http://127.0.0.1:3100/robots.txt \
            | grep --fixed-strings 'http://127.0.0.1:3100/sitemap.xml'
          curl --fail --silent http://127.0.0.1:3100/sitemap.xml \
            | grep --fixed-strings 'http://127.0.0.1:3100'
          curl --fail --silent http://127.0.0.1:3100/feed.xml \
            | grep --fixed-strings '<link>http://127.0.0.1:3100</link>'
          node --input-type=module <<'NODE'
          const expected = new Map([
            ['/admin', 307],
            ['/admin/login', 200],
            ['/media/cache-boundary-missing', 404],
            ['/photos/cache-boundary-missing', 404],
          ])
          const required = ['private', 'no-cache', 'no-store', 'max-age=0', 'must-revalidate']
          for (const [path, status] of expected) {
            const response = await fetch(`http://127.0.0.1:3100${path}`, { redirect: 'manual' })
            if (response.status !== status) {
              throw new Error(`${path} returned ${response.status}; expected ${status}`)
            }
            const value = response.headers.get('cache-control') ?? ''
            const directives = value.toLowerCase().split(',').map(entry => entry.trim())
            if (
              !required.every(directive => directives.includes(directive)) ||
              directives.includes('public') ||
              directives.includes('immutable') ||
              directives.some(directive => directive.startsWith('s-maxage='))
            ) {
              throw new Error(`${path} has unsafe Cache-Control: ${value || '(missing)'}`)
            }
          }
          for (const path of [
            '/admin/',
            '/media/cache-boundary-missing/',
            '/photos/cache-boundary-missing/',
          ]) {
            const response = await fetch(`http://127.0.0.1:3100${path}`, { redirect: 'manual' })
            const location = response.headers.get('location')
            if (response.status !== 308 || new URL(location, response.url).pathname !== path.slice(0, -1)) {
              throw new Error(`${path} did not preserve its identity-independent canonical redirect`)
            }
          }
          NODE
          docker exec "$container_name" test -r /app/THIRD_PARTY_NOTICES.md
          docker exec "$container_name" test ! -e /app/public/photos
          test -z "$(docker exec "$container_name" find /app -name '.env*' -print -quit)"

      - name: Upload container failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: container-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/container.log
          if-no-files-found: ignore
          retention-days: 7

  integration:
    name: Database and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      CLOUDBASE_ENV_ID: dev-env
      CLOUDBASE_ISSUER: http://127.0.0.1:53100
      RDB_BASE_URL: http://127.0.0.1:53000
      RDB_ADMIN_BASE_URL: http://127.0.0.1:53001
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_RDB_BASE_URL: http://127.0.0.1:53000
      BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      PHOTO_UPLOAD_DRIVER: local
      PHOTO_LOCAL_ROOT: /tmp/cs2cup-photos
      REGISTRATION_FINGERPRINT_SECRET: ci-only-registration-fingerprint-secret-2026
      REGISTRATION_CLIENT_IP_SOURCE: x-real-ip
      MIGRATION_REQUIRE_EXTERNAL_TEST: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure PostgreSQL client is available
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start and seed the local stack
        run: |
          npm run stack:up
          npm run stack:seed

      - name: Verify migration lifecycle
        run: npm run test:migrations

      - name: Run database regressions
        run: |
          npm run test:match-operations
          npm run test:match-schedule
          npm run test:security-boundaries
          npm run test:identity-foundations
          npm run test:session-foundations
          npm run test:registration-rate-limit

      - name: Build production application
        run: |
          npm run build
          node scripts/pack-standalone.mjs

      - name: Run isolated admin end-to-end tests
        run: npm run e2e:admin

      - name: Start production application
        run: |
          mkdir -p "${RUNNER_TEMP}/quality-artifacts"
          node .next/standalone/server.js \
            >"${RUNNER_TEMP}/quality-artifacts/application.log" 2>&1 &
          echo "$!" >"${RUNNER_TEMP}/quality-application.pid"

          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi

            if ! kill -0 "$(cat "${RUNNER_TEMP}/quality-application.pid")" 2>/dev/null; then
              cat "${RUNNER_TEMP}/quality-artifacts/application.log"
              exit 1
            fi

            sleep 1
          done

          cat "${RUNNER_TEMP}/quality-artifacts/application.log"
          exit 1

      - name: Run public end-to-end tests
        run: npm run e2e

      - name: Run accessibility and keyboard tests
        run: |
          npm run a11y
          npm run keyboard

      - name: Enforce browser performance budgets
        run: npm run perf

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p "${RUNNER_TEMP}/quality-artifacts"
          docker compose ps --all >"${RUNNER_TEMP}/quality-artifacts/docker-compose-ps.txt" || true
          docker compose logs --no-color >"${RUNNER_TEMP}/quality-artifacts/docker-compose.log" 2>&1 || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: quality-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local services
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/quality-application.pid" ]]; then
            kill "$(cat "${RUNNER_TEMP}/quality-application.pid")" 2>/dev/null || true
          fi
          docker compose down -v --remove-orphans
