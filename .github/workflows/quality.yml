---
name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare:
    name: Cloudflare checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Check types and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Run D1 and deterministic checks
        run: |
          npm run test:cloudflare-d1
          npm run test:csrf
          npm run test:seeding
          npm run test:schedule
          npm run test:object-cleanup
          npm run test:registration-fingerprint
          npm run test:site-config

      - name: Build Cloudflare Worker
        run: npm run cf:build
