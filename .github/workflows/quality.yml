---
name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare:
    name: Fast release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run project checks
        run: npm run check

      - name: Build Cloudflare Worker
        if: github.event_name != 'push'
        run: npm run cf:build

      - name: Enforce Worker size budget
        if: github.event_name != 'push'
        run: npm run cf:size

      - name: Install browser
        if: github.event_name != 'push'
        run: npx --no-install playwright install --with-deps chromium

      - name: Run frontend smoke checks
        if: github.event_name == 'pull_request'
        run: npm run browser:smoke -- --skip-build

      - name: Run full browser checks
        if: github.event_name == 'workflow_dispatch'
        run: npm run browser:check -- --skip-build
